<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌻</title>
    <style>
        body {
            /* Fondo de degradado animado */
            background: linear-gradient(-45deg, #fdf8e7, #fff9c4, #ffe082, #ffecb3);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
            color: #4a4a4a;
            height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Estilo general para las "páginas" */
        .screen {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 1s ease-in-out;
        }

        /* --- PANTALLA DE INICIO --- */
        #intro-screen {
            z-index: 10;
            /* Fondo semi-transparente para la primera pantalla */
            background-color: rgba(253, 248, 231, 0.9);
        }

        .intro-title {
            font-size: 2rem;
            color: #d4af37;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .gif-container {
            cursor: pointer;
            transition: transform 0.3s;
            animation: pulse-gif 2s infinite;
        }

        .gif-container:hover {
            transform: scale(1.05);
        }

        .gif-container img {
            border-radius: 15px;
            max-width: 250px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .click-hint {
            margin-top: 20px;
            color: #888;
            font-size: 0.95rem;
            font-weight: bold;
        }

        @keyframes pulse-gif {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* --- PANTALLA DEL JARDÍN --- */
        #garden-screen {
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            position: relative; /* Cambiado para permitir scroll si hay muchas flores */
            padding-bottom: 50px;
        }

        .container {
            max-width: 800px; /* Más ancho para más flores */
            padding: 20px;
            margin-top: 40px;
        }

        h1 {
            color: #d4af37;
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        #magic-heart {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #magic-heart:active {
            transform: scale(0.7);
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #6d6d6d;
        }

        .garden {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end; /* Alinea las flores por la base */
            gap: 10px;
            margin-bottom: 30px;
        }

        /* Animación y diseño de las flores */
        .flower-scale {
            display: inline-block;
            transition: transform 0.3s;
        }

        .flower-scale:hover {
            transform: scale(1.15) !important; /* Crece más al pasar el mouse */
            z-index: 20;
        }

        .flower-wrapper {
            position: relative;
            width: 80px;
            height: 120px;
            animation: float 3s ease-in-out infinite;
        }

        .flower {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            z-index: 2;
        }

        .petal {
            position: absolute;
            width: 24px;
            height: 68px;
            background: radial-gradient(circle, #ffe600, #fbc02d);
            border-radius: 50%;
            top: 4px;
            left: 28px;
            transform-origin: center 36px;
            box-shadow: 0 0 4px rgba(0,0,0,0.1);
        }

        .p1 { transform: rotate(0deg); } .p2 { transform: rotate(45deg); }
        .p3 { transform: rotate(90deg); } .p4 { transform: rotate(135deg); }
        .p5 { transform: rotate(180deg); } .p6 { transform: rotate(225deg); }
        .p7 { transform: rotate(270deg); } .p8 { transform: rotate(315deg); }

        .center {
            position: absolute;
            width: 35px;
            height: 35px;
            background: radial-gradient(circle, #5d4037, #3e2723);
            border-radius: 50%;
            top: 22px;
            left: 22px;
            z-index: 10;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }

        .stem {
            position: absolute;
            width: 6px;
            height: 80px;
            background: linear-gradient(to right, #2e7d32, #4caf50);
            top: 48px;
            left: 37px;
            z-index: 1;
            border-radius: 4px;
        }

        .leaf {
            position: absolute;
            width: 24px;
            height: 12px;
            background: #4caf50;
            border-radius: 50% 0 50% 0;
            top: 72px;
            left: 40px;
            z-index: 1;
            transform: rotate(-20deg);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .riddle {
            font-size: 0.9rem;
            color: #a68a56;
            font-style: italic;
            margin-top: 20px;
            opacity: 0.9;
            transition: opacity 0.5s;
        }

        /* --- MENSAJE OCULTO --- */
        .hidden-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            width: 85%;
            max-width: 400px;
            padding: 30px 20px;
            font-size: 1.3rem;
            line-height: 1.6;
            color: #fff;
            background: rgba(46, 39, 35, 0.95);
            border: 2px solid #fbc02d;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, transform 1s ease;
            z-index: 100;
        }

        .hidden-message.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 248, 231, 0.6);
            backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
            z-index: 50;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

    </style>
</head>
<body>

    <audio id="musica-fondo" src="./cancion.mp3" loop preload="auto"></audio>

    <div id="intro-screen" class="screen">
        <h2 class="intro-title">Holi, te tengo una sorpresa... ✨</h2>
        
        <div class="gif-container" onclick="entrarAlJardin()">
            <img src="./mi-sorpresa.gif" alt="Sorpresa">
        </div>
        
        <p class="click-hint">Toca a Morgana :3 (Asegúrate de tener volumen)</p>
    </div>

    <div id="garden-screen" class="screen">
        <div class="overlay" id="overlay"></div>

        <div class="container">
            <h1>¡Feliz 21 de Septiembre! <span id="magic-heart">💛</span></h1>
            <p class="subtitle">Un jardín para alegrar tu día...</p>

            <div class="garden" id="garden"></div>

            <p class="riddle" id="pista">Dicen que si le das 3 latidos al corazón, revela un secreto...</p>
        </div>

        <div class="hidden-message" id="secreto">
            Y recuerda... <br><br>
            <span style="color: #ffe600; font-size: 1.15em;">
                <strong>Puede que estas no sean las únicas flores que recibas 👀</strong>
            </span>
        </div>
    </div>

    <script>
        // --- LÓGICA DE TRANSICIÓN Y MÚSICA ---
        function entrarAlJardin() {
            const intro = document.getElementById('intro-screen');
            const gardenScreen = document.getElementById('garden-screen');
            const musica = document.getElementById('musica-fondo');
            
            // Inicia la música (volumen al 60% para que sea agradable)
            musica.volume = 0.6;
            musica.play();

            // Desvanece la pantalla de inicio
            intro.style.opacity = '0';
            
            setTimeout(() => {
                intro.style.display = 'none';
                gardenScreen.style.pointerEvents = 'auto'; 
                gardenScreen.style.opacity = '1';
            }, 800); 
        }

        // --- LÓGICA DEL JARDÍN MASIVO ---
        const garden = document.getElementById('garden');
        const numFlowers = 22; // Aumentamos la cantidad de flores a 22

        for(let i = 0; i < numFlowers; i++) {
            // Tamaños aleatorios (algunas más grandes, otras más pequeñas)
            let scale = (0.5 + Math.random() * 0.6).toFixed(2); 
            // Retraso aleatorio para que no floten todas al mismo tiempo
            let delay = (Math.random() * 2).toFixed(2); 
            // Márgenes aleatorios para que se vean desordenadas como un jardín real
            let marginX = (Math.random() * 20 - 10).toFixed(0);
            let marginY = (Math.random() * 30 - 15).toFixed(0);

            let flowerHTML = `
            <div class="flower-scale" style="transform: scale(${scale}); margin: ${marginY}px ${marginX}px;">
                <div class="flower-wrapper" style="animation-delay: ${delay}s">
                    <div class="flower">
                        <div class="petal p1"></div><div class="petal p2"></div>
                        <div class="petal p3"></div><div class="petal p4"></div>
                        <div class="petal p5"></div><div class="petal p6"></div>
                        <div class="petal p7"></div><div class="petal p8"></div>
                        <div class="center"></div>
                    </div>
                    <div class="stem"></div>
                    <div class="leaf"></div>
                </div>
            </div>`;
            garden.innerHTML += flowerHTML;
        }

        // --- LÓGICA DEL SECRETO OCULTO (Los 3 latidos) ---
        let heartClicks = 0;
        const heart = document.getElementById('magic-heart');
        
        heart.addEventListener('click', function() {
            heartClicks++;
            
            if(heartClicks === 3) {
                document.getElementById('secreto').classList.add('show');
                document.getElementById('overlay').classList.add('show');
                document.getElementById('pista').style.opacity = '0';
            }
            
            if(heartClicks > 3) {
                document.getElementById('secreto').classList.remove('show');
                document.getElementById('overlay').classList.remove('show');
                heartClicks = 0; 
            }
        });
    </script>

</body>
</html>
